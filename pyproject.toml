[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-business-analyst"
version = "1.0.0"
description = "Educational AI business reporting & data analysis agent (Week 8, Day 3 of 10 Weeks to AI Agents). Fictional data only."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Alex Figura" }]
dependencies = [
    "openai>=2.0",
    "duckdb>=1.1",
    "matplotlib>=3.8",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
# Only needed for Google Sheets service-account authentication in live mode.
live = ["google-auth>=2.30"]

[project.scripts]
northstar-analyst = "business_analyst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "scripts", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E701", "E731", "B008", "UP017"]
